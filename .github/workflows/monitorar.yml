name: Monitorar passagens

on:
  schedule:
    # A cada 6 horas (horário UTC). Ajuste conforme a cota das APIs.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitorar-passagens
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar preços e avisar promoções
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agente

      - name: Salvar histórico de preços
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "agente-passagens"
            git config user.email "agente-passagens@users.noreply.github.com"
            git add data/
            git commit -m "Atualiza histórico de preços"
            git push
          fi
